[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downscaling-radiation"
version = "0.1.0"
description = "Downscaling daily NASA POWER shortwave radiation (1 deg) to 10 km against NSRDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "xarray>=2023.6",
    "zarr>=3.0",
    "netcdf4>=1.6",
    "dask>=2023.6",
    "h5py>=3.9",
    "s3fs>=2023.6",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "xgboost>=2.0",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools]
packages = ["common", "data", "features", "models", "training", "evaluation", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E702", "B028", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
